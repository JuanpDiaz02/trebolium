<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153d31">
  <title>Trebolium · Contabilidad</title>
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#plan"><span class="brand-mark"><img src="/logo.png" alt=""></span><span>trebolium<small>LOS TRÉBOLES SRL</small></span></a>
    <nav id="nav" aria-label="Contabilidad"></nav>
    <div class="side-foot"><span class="status-dot"></span><div><span id="workspace-label">Espacio local</span><small>Los Tréboles SRL</small></div></div>
  </aside>
  <div class="shell">
    <header class="topbar">
      <button id="menu" class="icon-button" aria-label="Mostrar menú" aria-expanded="false"></button>
      <div id="crumb" class="crumb"></div>
      <div class="global-search">
        <label id="search-label" for="global"></label>
        <input id="global" type="search" placeholder="Buscar una sección…" autocomplete="off">
        <kbd>/</kbd>
        <div id="suggestions" hidden></div>
      </div>
      <span class="avatar" title="Los Tréboles SRL">LT</span>
    </header>
    <section class="demo-banner" id="demo-banner" aria-label="Modo demo" hidden>
      <p><strong>Demo de Trebolium</strong> · Datos ficticios. Los cambios son temporales y solo se ven en este navegador.</p>
      <button class="btn" type="button" id="reset-demo">Restablecer demo</button>
    </section>
    <section class="demo-banner" id="pilot-bar" aria-label="Cuenta del piloto" hidden></section>
    <main id="content"><p>Cargando Trebolium…</p></main>
    <footer class="footer"><span>Trebolium <span class="muted">·</span> Contabilidad</span><span>Los Tréboles SRL</span></footer>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
